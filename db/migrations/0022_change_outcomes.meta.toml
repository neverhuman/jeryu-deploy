# Structured metadata for 0022_change_outcomes.sql. The SQL file is
# checksum-bound once applied, so its lock and timeout posture lives here.

migration = "0022_change_outcomes"
engine = "sqlite"
store = "<data_dir>/shift.sqlite"
owner = "crates/jeryu-api/src/web/human_time.rs"
apply = "EventStore::open -> migrate_shift_store(), one transaction per migration"

[lock_timeout]
mechanism = "rusqlite Connection::busy_timeout"
value = "5s"

[statement_timeout]
# Two empty CREATE TABLEs and three indexes over no rows.
mechanism = "table creation over no rows"
value = "milliseconds"

[rollback]
plan = "stop the server, DROP TABLE change_human_minutes and change_outcomes, delete version 22 from shift_schema_migrations; roll back together with the binary"
backup = "sqlite3 shift.sqlite '.backup change-outcomes.sqlite' before rollback; minutes people spent cannot be rebuilt from the pruned event log"

[verify]
check = "cargo test -p jeryu-api --features web --lib web::human_time"
