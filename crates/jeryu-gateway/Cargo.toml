[package]
name = "jeryu-gateway"
description = "Control-plane provider gateway: verifies relay capabilities and adds vault credentials upstream (K3)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Test harnesses only: lets an upstream table point at a loopback HTTP mock.
# Production code never enables this; see tests/policy in jeryu-mock-provider.
loopback-upstream = []

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
parking_lot.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
zeroize = "1"

[dev-dependencies]
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
