jeryu-ci-compiler = { path = "../jeryu-ci-runner/crates/jeryu-ci-compiler" }
jeryu-ci-ir = { path = "../jeryu-ci-runner/crates/jeryu-ci-ir" }
jeryu-ci-scheduler = { path = "../jeryu-ci-runner/crates/jeryu-ci-scheduler" }
jeryu-runner-core = { path = "../jeryu-ci-runner/crates/jeryu-runner-core" }
jeryu-runner-microvm = { path = "../jeryu-ci-runner/crates/jeryu-runner-microvm" }
jeryu-runner-native = { path = "../jeryu-ci-runner/crates/jeryu-runner-native" }
jeryu-runner-oci = { path = "../jeryu-ci-runner/crates/jeryu-runner-oci" }
jeryu-runner-protocol = { path = "../jeryu-ci-runner/crates/jeryu-runner-protocol" }
jeryu-runner-registry = { path = "../jeryu-ci-runner/crates/jeryu-runner-registry" }
jeryu-runnerd = { path = "../jeryu-ci-runner/crates/jeryu-runnerd" }
jeryu-sandbox-linux = { path = "../jeryu-ci-runner/crates/jeryu-sandbox-linux" }

[patch."https://github.com/neverhuman/jeryu-core.git"]
