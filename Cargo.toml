[workspace]
resolver = "2"
members = [
  "crates/jeryu-api",
  "crates/jeryu-cli",
  "crates/jeryu-split-tool",
]
exclude = [
  "fixtures/rust-small",
]

[workspace.package]
version = "5.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/neverhuman/jeryu"
authors = ["Jeryu"]
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.13"
jeryu-repogate = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-release-ops.git", tag = "jeryu-release-ops-v5.0.0-split.8" }
parking_lot = "0.12"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }

# Release graph unification. Historical sibling releases still name the GitHub
# Core source at split.0; redirect only those two transitive packages to the
# reviewed local-forge split.12 tag so Cargo has one immutable Core identity.
[patch."https://github.com/neverhuman/jeryu-core.git"]
jeryu-core = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-core.git", tag = "jeryu-core-v5.0.0-split.12" }
jeryu-proof = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-core.git", tag = "jeryu-core-v5.0.0-split.12" }

# Runner unification. jeryu-api and the historical jeryu-intelligence release both
# name the GitHub jeryu-ci-runner source at split.0; redirect every runner package
# to the reviewed local-forge split.4 tag so Cargo has one runner identity. split.2+
# carries the cgroup capability-probe fix: at split.0, parallel probes remove each
# other's leaf and agent runs under systemd fail with EOPNOTSUPP (os error 95).
[patch."https://github.com/neverhuman/jeryu-ci-runner.git"]
jeryu-agent-stream = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-agentbridge = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-ci-compiler = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-ci-ir = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-ci-scheduler = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-runner-core = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-runner-microvm = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-runner-native = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-runner-oci = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-runner-protocol = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-runner-registry = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-runnerd = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }
jeryu-sandbox-linux = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-ci-runner.git", tag = "jeryu-ci-runner-v5.0.0-split.4" }

# Intelligence and release-ops unification. The two repositories pin each other
# at split.0, so their release tags form a cycle: jeryu-release-ops names the
# local-forge Intelligence source at split.0, and the Intelligence release names
# the GitHub release-ops source at split.0. Cargo only breaks a cycle edge that
# is patched, and it rejects a patch whose target repeats the patched
# repository, so each unifier redirects one transitive package onto the other
# hosted spelling of the same repository at the reviewed tag. Both spellings
# resolve to git.neverhuman.org through `.cargo/hosted-gitconfig`.
[patch."http://127.0.0.1:8787/git/jeryu/jeryu-intelligence.git"]
jeryu-rustjet = { git = "https://github.com/neverhuman/jeryu-intelligence.git", tag = "jeryu-intelligence-v5.0.0-split.4" }

[patch."https://github.com/neverhuman/jeryu-release-ops.git"]
jeryu-signing = { git = "http://127.0.0.1:8787/git/jeryu/jeryu-release-ops.git", tag = "jeryu-release-ops-v5.0.0-split.8" }

# Account creation and login hash with argon2 at production cost; unoptimized it
# takes ~1 s per hash, which dominated the web tests' wall time. Optimizing just
# the hash crates keeps debug builds of everything else fast to compile.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
