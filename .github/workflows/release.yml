name: release

on:
  push:
    tags: ['jeryu-deploy-v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JERYU_CI_JOBS: "40"
  CARGO_BUILD_JOBS: "40"
  JERYU_CI_USE_SCCACHE: "0"
  # Generated from local Jeryu release authority; consumer jobs verify only.
  JERYU_JANKURAI_BIN: "/home/ubuntu/.jeryu/bin/jankurai"
  # BEGIN GENERATED JANKURAI WORKFLOW PIN — DO NOT EDIT
  # No Jankurai identity is pinned here; see ops/ci/lib.sh require_jankurai.
  # END GENERATED JANKURAI WORKFLOW PIN

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout without marketplace actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify governed Jankurai
        run: bash ops/ci/ensure-jankurai.sh
      - name: Security toolchain (syft/grype/cosign)
        run: bash ops/ci/security-tools.sh
      - name: Release build + SBOM + cosign sign + publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Site values, not defaults in code: the signer identity the rollback
          # install must verify (with {tag} for the rollback target's tag) and
          # the issuer that may vouch for it. Unset means the receipt refuses.
          JERYU_RELEASE_SIGNER_IDENTITY: ${{ vars.JERYU_RELEASE_SIGNER_IDENTITY }}
          JERYU_RELEASE_OIDC_ISSUER: ${{ vars.JERYU_RELEASE_OIDC_ISSUER }}
        run: bash ops/ci/release.sh
