name: local-ci-parity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ci-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  JERYU_CI_JOBS: "40"
  CARGO_BUILD_JOBS: "40"
  # Generated from local Jeryu release authority; consumer jobs verify only.
  JERYU_JANKURAI_BIN: "/home/ubuntu/.jeryu/bin/jankurai"
  # BEGIN GENERATED JANKURAI WORKFLOW PIN — DO NOT EDIT
  # No Jankurai identity is pinned here; see ops/ci/lib.sh require_jankurai.
  # END GENERATED JANKURAI WORKFLOW PIN

jobs:
  jankurai-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout without marketplace actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --no-tags --depth 64 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          git fetch --no-tags --depth 64 origin refs/heads/main:refs/remotes/origin/main
      - name: Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify governed Jankurai
        run: bash ops/ci/ensure-jankurai.sh
      - name: Refute hostile auditor substitution
        run: bash ops/ci/test-governed-jankurai.sh
      - name: Install open security tools
        run: bash ops/ci/security-tools.sh
      - name: Jankurai security and audit lane
        run: bash ops/ci/jankurai.sh
      - name: Upload Jankurai audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jankurai-audit-evidence
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            target/jankurai/security/evidence.json
            target/jankurai/security/sbom/**
          if-no-files-found: error
