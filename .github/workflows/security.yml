name: security-and-supply-chain

# Standalone security and supply-chain lane. Each step calls the same checked-in
# wrapper used locally: source scanning, dependency policy, then unsigned
# non-release SBOM/vulnerability/provenance evidence. Release signing remains in
# the separately authorized tag lane and is not claimed here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-and-supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  JERYU_CI_JOBS: "40"
  CARGO_BUILD_JOBS: "40"
  CARGO_TERM_COLOR: always
  SYFT_VERSION: "1.40.0"
  GRYPE_VERSION: "0.99.0"
  COSIGN_VERSION: "2.4.3"
  # Generated from local Jeryu release authority; consumer jobs verify only.
  JERYU_JANKURAI_BIN: "/home/ubuntu/.jeryu/bin/jankurai"
  # BEGIN GENERATED JANKURAI WORKFLOW PIN — DO NOT EDIT
  # No Jankurai identity is pinned here; see ops/ci/lib.sh require_jankurai.
  # END GENERATED JANKURAI WORKFLOW PIN

jobs:
  security:
    name: security lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without marketplace actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install open security tools
        run: bash ops/ci/security-tools.sh
      - name: Direct pinned gitleaks scan
        # Scan the candidate commit, not immutable repository history. The next
        # step separately scans tracked and untracked files in the current tree.
        run: gitleaks detect --source . --log-opts=-1 --redact --verbose
      - name: Source-security receipt lane
        run: bash ops/ci/security.sh
      - name: Hosted dependency-source lane
        run: bash ops/ci/dependency-sources.sh
      - name: Cargo dependency policy lane
        run: |
          set -o pipefail
          source ops/ci/hosted-git-env.sh
          mkdir -p target/security
          cargo audit --deny warnings --json > target/security/cargo-audit.json
          cargo deny check advisories bans licenses sources 2>&1 | tee target/security/cargo-deny.log
      - name: SBOM and provenance lane
        run: bash ops/ci/sbom-provenance.sh
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-and-supply-chain-evidence
          path: |
            target/security/evidence.json
            target/security/dependency-sources.json
            target/security/cargo-audit.json
            target/security/cargo-deny.log
            target/jankurai/security/evidence.json
            target/jankurai/security/sbom/
          if-no-files-found: error
